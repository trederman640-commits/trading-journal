<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itachi Journaling</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Itachi Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e9ec; --panel:rgba(255,255,255,.76); --solid:#ffffff; --ink:#0c0c0e; --muted:#7c7c84; --line:rgba(12,12,14,.08); --soft:#f1f1f3;
  --accent:#0c0c0e; --accent-ink:#ffffff; --nav-on:#0c0c0e; --nav-on-ink:#ffffff;
  --inv:#0c0c0e; --inv-ink:#f5f5f6; --inv-muted:#8e8e96; --inv-line:rgba(255,255,255,.1);
  --win:#12a05f; --loss:#e0464e; --win-soft:rgba(18,160,95,.11); --loss-soft:rgba(224,70,78,.1); --warn:#d49a00;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 12px 40px rgba(0,0,0,.06);
  --chart:#0c0c0e; --c2:#3f3f46; --c3:#71717a; --c4:#27272a; --glow:rgba(0,0,0,.14); --edge:rgba(0,0,0,.16);
  --bgfx:radial-gradient(900px 520px at 85% -5%,#ffffff 0%,rgba(255,255,255,0) 60%),radial-gradient(700px 500px at -5% 105%,#f8f8fa 0%,rgba(248,248,250,0) 60%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070708; --panel:rgba(17,17,19,.86); --solid:#131315; --ink:#f3f3f4; --muted:#85858d; --line:rgba(255,255,255,.08); --soft:#19191c;
  --accent:#f3f3f4; --accent-ink:#0b0b0c; --nav-on:rgba(255,255,255,.08); --nav-on-ink:#ffffff;
  --inv:#18181b; --inv-ink:#f3f3f4; --inv-muted:#85858d; --inv-line:rgba(255,255,255,.08);
  --win:#3ee08f; --loss:#ff5d6c; --win-soft:rgba(62,224,143,.1); --loss-soft:rgba(255,93,108,.1); --warn:#f5a524;
  --chart:#f3f3f4; --c2:#d4d4d8; --c3:#a1a1aa; --c4:#e4e4e7; --glow:rgba(255,255,255,.22); --edge:rgba(255,255,255,.18);
  --shadow:none; --bgfx:radial-gradient(900px 520px at 0% 0%,rgba(255,255,255,.07),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,255,255,.03),transparent 60%);
  }
}
:root[data-theme="dark"]{
  --bg:#070708; --panel:rgba(17,17,19,.86); --solid:#131315; --ink:#f3f3f4; --muted:#85858d; --line:rgba(255,255,255,.08); --soft:#19191c;
  --accent:#f3f3f4; --accent-ink:#0b0b0c; --nav-on:rgba(255,255,255,.08); --nav-on-ink:#ffffff;
  --inv:#18181b; --inv-ink:#f3f3f4; --inv-muted:#85858d; --inv-line:rgba(255,255,255,.08);
  --win:#3ee08f; --loss:#ff5d6c; --win-soft:rgba(62,224,143,.1); --loss-soft:rgba(255,93,108,.1); --warn:#f5a524;
  --chart:#f3f3f4; --c2:#d4d4d8; --c3:#a1a1aa; --c4:#e4e4e7; --glow:rgba(255,255,255,.22); --edge:rgba(255,255,255,.18);
  --shadow:none; --bgfx:radial-gradient(900px 520px at 0% 0%,rgba(255,255,255,.07),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,255,255,.03),transparent 60%);
}
*{box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bgfx),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{margin:16px;margin-inline-end:0;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:18px 14px;display:flex;flex-direction:column;gap:2px;align-self:start;min-height:calc(100vh - 32px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:2px 8px 14px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.ws{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:16px;background:var(--solid);margin-bottom:12px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#55555c,#0c0c0e);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ws b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws small{color:var(--muted);font-size:12px}
.side>.btn{justify-content:center;margin-bottom:8px}
.sec{font-size:11px;color:var(--muted);padding:12px 14px 6px;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;background:none;border:0;cursor:pointer;font-size:14px;width:100%;text-align:start;white-space:nowrap}
.nav svg{width:18px;height:18px;flex:none;opacity:.7}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--nav-on);color:var(--nav-on-ink)}
.nav.on svg{opacity:1}
.side .spacer{flex:1;min-height:12px}
.tip{border:1px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--solid);font-size:12px;color:var(--muted);margin:6px 0 8px;line-height:1.5}
.tip b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.tip a{color:var(--ink);font-weight:600}
/* announcements */
.ad{border-radius:20px;padding:14px;background:radial-gradient(300px 160px at 90% -10%,rgba(255,255,255,.18),transparent 60%),var(--inv);color:var(--inv-ink);margin:6px 0 8px;display:flex;flex-direction:column;gap:8px;white-space:normal}
.ad-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ad-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center}
.ad-badge i{width:6px;height:6px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:#5b93f0}
.ad-badge i.service{background:#3fd28f} .ad-badge i.offer{background:#f0b840} .ad-badge i.alert{background:#ff6b6f}
.ad-x{background:rgba(255,255,255,.1);border:0;color:var(--inv-ink);cursor:pointer;font-size:12px;line-height:1;padding:5px 10px;border-radius:999px}
.ad-x:hover{background:rgba(255,255,255,.2)}
@keyframes adin{from{opacity:0;transform:translateX(var(--from,-40px))}to{opacity:1;transform:none}}
.float-ad{position:fixed;bottom:20px;inset-inline-end:20px;width:290px;z-index:40;animation:adin .5s cubic-bezier(.2,.7,.2,1) both}
[dir="ltr"] .float-ad{--from:40px}
.float-ad:empty{display:none}
.reqlist{display:flex;flex-direction:column;margin-top:12px}
.reqrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.reqrow:last-child{border-bottom:0}
.reqrow .av{width:38px;height:38px;flex:none}
.reqinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.reqinfo small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reqbtns{display:flex;gap:6px;flex-wrap:wrap}
.gmailrow{display:flex;justify-content:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70;background:var(--solid);color:var(--ink);border:1px solid var(--edge);border-radius:999px;padding:12px 20px;box-shadow:0 18px 50px rgba(0,0,0,.4);font-weight:600;animation:adin .4s both}
/* brand, access gate, welcome, update bar */
.mark.emblem{background:none;width:32px;height:32px;border-radius:9px;overflow:hidden}
.mark.emblem svg{width:32px;height:32px}
.av{overflow:hidden}
.av img,.avbig img{width:100%;height:100%;object-fit:cover;display:block}
.avpick{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px}
.avbig{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:32px;font-weight:700;overflow:hidden}
.nav.locked{opacity:.55}
.nav .lk{margin-inline-start:auto;display:inline-flex}
.nav .lk svg{width:14px;height:14px;opacity:.9}
.side>a.btn{justify-content:center;margin-bottom:8px}
.gate{max-width:560px;margin:30px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 24px}
.gate h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.gate p{margin:0;line-height:1.7}
.gate-ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:30px}
.gate-ic svg{width:30px;height:30px}
.gate-ic.ok{color:var(--win);background:var(--win-soft)}
.gate-form{width:100%;display:grid;gap:10px;text-align:start}
.codebox{border:1px dashed var(--muted);border-radius:14px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.codebox small{color:var(--muted);font-size:11.5px}
.codebox b{font-size:22px;letter-spacing:.08em}
.big-btn{padding:13px 28px;font-size:15px}
#welcomeDlg{max-width:420px}
.welcome{padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wl-mark svg{width:84px;height:84px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.welcome h2{margin:6px 0 0;font-size:24px;font-weight:600}
.wl-by{margin:0;font-size:16px}
.welcome p{margin:0;line-height:1.7}
.wl-socials{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 6px}
.soc{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;transition:transform .2s}
.soc:hover{transform:translateY(-2px)}
.soc svg{width:17px;height:17px}
.soc.big{display:inline-flex;gap:8px;width:auto;height:auto;padding:9px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
.soc.telegram.big{background:#229ED9;border-color:#229ED9;color:#fff}
.soc.instagram.big{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);border-color:transparent;color:#fff}
.soc.tiktok.big{background:#111;border-color:#333;color:#fff}
.socials{display:flex;align-items:center;gap:6px;padding:10px 6px 2px;border-top:1px solid var(--line);margin-top:8px}
.socials span{font-size:12px;color:var(--muted);margin-inline-end:auto}
.updbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--solid);border:1px solid var(--edge);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-size:13px;max-width:calc(100% - 24px)}
[dir="rtl"] .updbar{padding:8px 16px 8px 8px}
.updbar span{display:flex;align-items:center;gap:8px}
.updbar svg{width:16px;height:16px}
.updbar[hidden]{display:none}
.float-ad .ad{margin:0;border:1px solid var(--inv-line);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.ad-x:hover{color:var(--inv-ink)}
.ad-img{width:100%;aspect-ratio:4/3;height:auto;object-fit:cover;border-radius:14px;display:block;transition:transform .3s}
.ad a:hover .ad-img{transform:scale(1.02)}
.ad-title{font-size:14px;line-height:1.4}
.ad-body{margin:0;font-size:12.5px;color:var(--inv-muted);line-height:1.6}
.ad .ad-btn{background:var(--inv-ink);color:var(--inv);align-self:flex-start}
.ad-nav{display:flex;align-items:center;gap:8px;justify-content:center}
.ad-nav button{background:none;border:0;color:var(--inv-muted);cursor:pointer;font-size:18px;padding:0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-block;margin:0 2px}
.dots i.on{background:var(--inv-ink)}
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.adrow{display:flex;flex-direction:column;gap:10px}
.adrow .ad{margin:0}
.admeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mainAd{display:none}
#mainAd:empty{display:none!important}

/* layout */
main{padding:28px clamp(16px,2.6vw,36px) 56px;min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em;margin-inline-end:auto}
.head small{color:var(--muted);font-size:15px;font-weight:400;letter-spacing:0}
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--solid);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.block{width:100%;justify-content:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--solid);display:grid;place-items:center;cursor:pointer;color:var(--ink);font-weight:700;font-size:12px;flex:none}
.icon-btn svg{width:18px;height:18px}
.chipsel{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:9px 14px;font-weight:500;cursor:pointer}
.panel{background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:24px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.panel h2 svg{width:17px;height:17px;opacity:.7}
.panel h2 .r{margin-inline-start:auto;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;flex-wrap:wrap}
.panel h2 .r a{color:var(--muted);text-decoration:none}
.panel.inv{background:radial-gradient(520px 260px at 85% -10%,rgba(255,255,255,.16),transparent 60%),radial-gradient(400px 300px at 0% 120%,rgba(255,255,255,.07),transparent 60%),var(--inv);color:var(--inv-ink);border-color:transparent}
.panel.inv .hint,.panel.inv .muted{color:var(--inv-muted)}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.card .k{color:var(--muted);font-size:12.5px}
.card .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.card .s{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.row{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.row.r12{grid-template-columns:1fr 2fr}
.row.r21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* dashboard pieces */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:2px 20px;border-inline-start:1px solid var(--line);min-width:0}
.kpi:first-child{border:0;padding-inline-start:0}.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.025em;margin:6px 0}
.delta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:8px;color:#fff;flex:none}
.delta i.up{background:var(--win)} .delta i.down{background:var(--loss)} .delta i.flat{background:var(--muted)}
.hero-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.big{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.seg{display:flex;gap:4px;margin:16px 0 12px}
.seg i{height:12px;border-radius:5px;display:block;min-width:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend b{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.insight{font-size:23px;line-height:1.4;font-weight:300;letter-spacing:-.01em;color:var(--muted);margin:4px 0 0}
.insight b{color:var(--ink);font-weight:600}
.ilist{margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.ilist b{color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv>span:first-child{color:var(--muted)}
.kv:last-of-type{border:0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600}
.pill.ok{background:var(--win-soft);color:var(--win)}
canvas{width:100%;height:240px;display:block}
canvas.hero{height:290px}
canvas.mini{height:56px}
canvas.gauge{height:220px}
canvas.strip{height:70px}
canvas.radar{height:260px}
.num,.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* tables & filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select,.inp{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--solid)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.buy{background:var(--win-soft);color:var(--win)} .tag.sell{background:var(--loss-soft);color:var(--loss)}
.tag.gray{background:var(--soft);color:var(--muted);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:6px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:76px;border:1px solid var(--line);border-radius:14px;padding:7px 9px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:var(--solid)}
.cal .d:hover{border-color:var(--muted)}
.cal .d.out{opacity:.3;cursor:default;background:transparent}
.cal .d.p{background:var(--win-soft);border-color:transparent}
.cal .d.l{background:var(--loss-soft);border-color:transparent}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d b{font-size:14px;font-weight:600}
.cal .d .dn{color:var(--muted)}
.cal .wk{background:var(--soft);border-radius:14px;padding:7px 9px;font-size:11.5px;display:flex;flex-direction:column;justify-content:center;gap:2px}

/* reports */
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr 90px;gap:10px;align-items:center;padding:7px 0}
.hbar .track{height:10px;background:var(--soft);border-radius:999px;position:relative;overflow:hidden}
.hbar .track i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:999px}
.tabs{display:inline-flex;background:var(--soft);padding:4px;border-radius:999px;gap:2px;flex-wrap:wrap;align-self:flex-start;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* playbooks */
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pb{display:flex;flex-direction:column;gap:12px}
.pb .st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pb .st div{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px}
.pb .st span{display:block;font-size:11.5px;color:var(--inv-muted)}
.pb ol{margin:0;padding-inline-start:20px;color:var(--inv-muted);font-size:13px;line-height:1.7}
.pb .btn.ghost{background:rgba(255,255,255,.1);color:var(--inv-ink);border-color:transparent}
.pbbar{height:6px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.pbbar i{display:block;height:100%;background:var(--inv-ink);border-radius:999px}

/* daily */
.day{display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dayhead .big{font-size:26px}
.dayhead .meta{display:flex;gap:16px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.dayhead .meta b{color:var(--ink)}
.dayhead canvas{width:180px;flex:none}
textarea.note{width:100%;min-height:90px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--soft);line-height:1.8;resize:vertical}

/* notebook */
.nb{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:520px}
.nblist{display:flex;flex-direction:column;gap:4px;overflow:auto}
.nbitem{padding:10px 12px;border-radius:14px;cursor:pointer}
.nbitem:hover{background:var(--soft)}
.nbitem.on{background:var(--nav-on);color:var(--nav-on-ink)}
.nbitem small{display:block;opacity:.6}
.nbed{display:flex;flex-direction:column;gap:10px}
.nbed input{font-size:24px;font-weight:600;letter-spacing:-.02em;border:0;background:transparent;outline:none}
.nbed textarea{flex:1;min-height:420px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--soft);line-height:1.9;resize:vertical;outline:none}

/* goal */
.goalbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.goalbar i{display:block;height:100%;background:var(--ink);border-radius:999px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:26px;padding:0;max-width:800px;width:calc(100% - 24px);background:var(--solid);color:var(--ink);max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,10,12,.45);backdrop-filter:blur(4px)}
.form{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form h2{grid-column:1/-1;margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.form h3{grid-column:1/-1;margin:8px 0 0;font-size:12px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);padding-top:14px;letter-spacing:.03em}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
label input,label select,label textarea{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.full{grid-column:1/-1} .half{grid-column:span 2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--loss-soft);border-color:var(--loss);color:var(--loss)}
.sympick{position:relative;z-index:5}
.sympick:has(.symdrop:not([hidden])){z-index:6}
.pbopt{direction:inherit}
.pbopt small{color:var(--muted);font-weight:400;font-size:11px}
.outc.ex{grid-template-columns:repeat(3,1fr)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:1.5px dashed var(--line);background:var(--soft);transition:border-color .2s}
.shot:has(img){border-style:solid}
.shot.drag{border-color:var(--ink)}
.shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.shot .cap{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;z-index:1}
.shot-x{position:absolute;top:10px;inset-inline-end:10px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;width:28px;height:28px;z-index:1}
.shot-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);text-align:center;padding:14px;font-size:12px}
.shot-empty svg{width:26px;height:26px}
.shot-empty b{color:var(--ink);font-size:14px}
.shots.view .shot-empty{cursor:default}
.tshot{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.tshot-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:700px){ .shots{grid-template-columns:1fr} .outc.ex{grid-template-columns:1fr} }
.symdrop{position:absolute;top:100%;inset-inline:0;margin-top:6px;z-index:20;background:var(--solid);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:12px;max-height:320px;overflow:auto;animation:rise .2s both;color:var(--ink)}
.symdrop[hidden]{display:none}
.sg{font-size:11px;color:var(--muted);margin:10px 2px 6px}
.sg:first-child{margin-top:0}
.sgrid{display:flex;flex-wrap:wrap;gap:6px}
.symopt{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;direction:ltr}
.symopt:hover,.symopt.on{border-color:var(--ink)}
.symdel{color:var(--muted);font-weight:400;font-size:14px;line-height:1}
.symdel:hover{color:var(--loss)}
.symadd{width:100%;margin-top:10px;border:1px dashed var(--muted);background:none;border-radius:12px;padding:9px;cursor:pointer;color:var(--ink);font-weight:600}
.symfoot{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.symfoot input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font-size:13px;direction:ltr}
.outc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.outc button{padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.outc button:hover{border-color:var(--muted)}
.outc button.on{border-color:var(--ink);background:var(--solid)}
.outc button.win.on{border-color:var(--win);background:var(--win-soft);color:var(--win)}
.outc button.loss.on{border-color:var(--loss);background:var(--loss-soft);color:var(--loss)}
.stars button{background:none;border:0;font-size:24px;cursor:pointer;padding:0 2px;color:var(--line)}
.stars button.on{color:var(--warn)}
.rules label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding:4px 0}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:120px;height:80px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb button{position:absolute;top:4px;inset-inline-end:4px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;width:22px;height:22px;padding:0}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--soft)}
.actions{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.actions .btn.danger{margin-inline-end:auto}
.hint{font-size:12px;color:var(--muted)}
#lightbox{max-width:95vw;background:transparent;border:0;box-shadow:none}
#lightbox img{max-width:95vw;max-height:90vh;display:block;border-radius:14px}

/* onboarding */
.onboard{position:fixed;inset:0;background:var(--bgfx),var(--bg);z-index:50;display:none;flex-direction:column;overflow:auto}
.onboard.show{display:flex}
.ob-top{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(24px)}
.ob-top b{font-size:16px;display:flex;align-items:center;gap:10px}
.progress{flex:1;max-width:600px;margin:0 auto;height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.ob-body{flex:1;width:100%;max-width:480px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:12px}
.ob-body h2{text-align:center;font-size:28px;font-weight:600;letter-spacing:-.025em;margin:0 0 4px}
.ob-body p.sub{text-align:center;color:var(--muted);margin:0 0 14px}
.opt{display:flex;align-items:center;gap:16px;padding:16px 20px;border:2px solid var(--line);border-radius:20px;background:var(--solid);cursor:pointer;text-align:start}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--ink)}
.opt .ic{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{color:var(--muted)}
.ob-body label input{font-size:16px;padding:13px 14px}
.ob-nav{display:flex;gap:8px;justify-content:center;margin-top:16px}
.ob-nav .btn{min-width:160px;padding:13px;justify-content:center}
.ob-nav .btn:disabled{opacity:.35;cursor:not-allowed}


/* ---- neon dashboard & motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.18)}50%{transform:rotate(10deg) scale(1.18)}75%{transform:rotate(-6deg) scale(1.08)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 9px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
body::before{content:"";position:fixed;width:560px;height:560px;border-radius:50%;background:var(--glow);filter:blur(150px);opacity:.35;top:-220px;inset-inline-start:-180px;pointer-events:none;animation:drift 20s ease-in-out infinite;z-index:-1}
.nav svg,.btn svg,.icon-btn svg,.panel h2 svg,.ib svg,.sbsearch svg,.asset .ic{transition:transform .3s}
.nav:hover svg,.nav:active svg,.btn:hover svg,.btn:active svg,.icon-btn:hover svg,.icon-btn:active svg,.panel h2:hover svg,.pagehead:hover .ib svg,.sbsearch:focus-within svg,.asset:hover .ic{animation:wiggle .6s ease}
.btn:active,.icon-btn:active,.nav:active,.chip:active,.outc button:active{animation:pop .25s ease}
.panel,.card,.kcard{transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s}
.panel:hover{border-color:var(--edge)}
.kcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px var(--glow)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pulse 1.8s infinite}
.cnt{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.nav .cnt{margin-inline-start:auto}
.dec{color:var(--muted);font-weight:400}

.pagehead{display:flex;align-items:center;gap:14px;padding:14px 18px}
.pagehead .ib{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:var(--soft);flex:none}
.pagehead .ib svg{width:22px;height:22px}
.pagehead b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pagehead small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
h1.ov{font-size:32px;font-weight:500;letter-spacing:-.025em}
.head .chipsel{padding:5px 12px;font-size:12px}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:15px;height:15px}
.sub{font-size:12.5px;color:var(--muted);margin:-8px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill svg{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-inline-end:4px}

.kcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kcard{--kc:var(--chart);position:relative;overflow:hidden;border-radius:20px;padding:16px 18px 18px;border:1px solid color-mix(in srgb,var(--kc) 32%,var(--line));background:radial-gradient(260px 140px at 100% 100%,color-mix(in srgb,var(--kc) 14%,transparent),transparent 70%),var(--panel);min-height:156px;backdrop-filter:blur(24px)}
[dir="rtl"] .kcard{background:radial-gradient(260px 140px at 0% 100%,color-mix(in srgb,var(--kc) 14%,transparent),transparent 70%),var(--panel)}
.kcard .t{font-size:15px;font-weight:500;position:relative;z-index:1}
.kcard .st{font-size:12px;color:var(--muted);margin-top:2px;position:relative;z-index:1}
.kcard .v{font-size:26px;font-weight:500;margin-top:22px;letter-spacing:-.015em;position:relative;z-index:1}
.kcard .d{font-size:12px;color:var(--muted);margin-top:4px;position:relative;z-index:1}
.kcard .d b{color:var(--kc);font-weight:600}
.kcard canvas{position:absolute;inset-inline-end:0;bottom:0;width:44%;height:56%}
.kcard .v,.kcard .d{max-width:56%}

.cfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
.cfoot small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.cfoot b{font-size:19px;font-weight:500}
.asset{display:grid;grid-template-columns:30px minmax(0,1fr) 84px auto;gap:10px;align-items:center;padding:7px 0}
.asset .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);background:var(--soft);border:1px solid var(--line)}
.asset .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .nm small{display:block;color:var(--muted);font-size:11px}
.asset canvas{height:28px;width:84px}
.asset b{font-size:13px;font-weight:600}
.row3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}

.sbsearch{display:flex;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--soft);margin-bottom:6px;cursor:text}
.sbsearch svg{width:16px;height:16px;color:var(--muted);flex:none}
.sbsearch input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink);font-size:13px}
.sgoal{text-align:center;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:4px}
.sgoal canvas{height:78px;width:170px;margin:0 auto}
.sgoal .gnum{font-size:15px;margin-top:-26px}
.sgoal .gnum b{font-weight:600}
.sgoal small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

@media (max-width:1150px){ .kcards{grid-template-columns:repeat(2,minmax(0,1fr))} .row3{grid-template-columns:1fr 1fr} }
@media (max-width:900px){ .row3{grid-template-columns:1fr} .side .sbsearch,.side .sgoal{display:none} h1.ov{font-size:26px} }
@media (max-width:560px){ .kcards{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *,*::before{animation:none!important;transition:none!important} }

@media (max-width:1150px){
  .dash{grid-template-columns:1fr}
  .dash>.col:last-child{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{margin:0;border-radius:0;position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border:0;border-bottom:1px solid var(--line)}
  .side .logo,.side .ws,.side .sec,.side .spacer,.side .tip,#sideAd{display:none}
  .side .socials{display:none}
  .float-ad{inset-inline:12px;bottom:12px;width:auto}
  .float-ad .ad-img{aspect-ratio:16/9}
  #mainAd .ad{margin:0}
  .side>.btn{margin:0}
  .nav{width:auto}
  .row,.row.r12,.row.r21,.nb{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:16px}
  .kpi{border:0;padding:0}
  .form{grid-template-columns:1fr 1fr}
  .half{grid-column:1/-1}
  .big{font-size:32px}
  .cal{gap:3px} .cal .d{min-height:56px;padding:4px;font-size:10px;border-radius:10px} .cal .d b{font-size:11px} .cal .wk{font-size:10px;padding:4px;border-radius:10px}
  .dayhead canvas{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="view"></main>
</div>

<div class="float-ad" id="floatAd"></div>
<div class="updbar" id="updBar" hidden></div>
<dialog id="welcomeDlg"></dialog>
<input type="file" id="setAvIn" accept="image/*" hidden>

<dialog id="tradeDlg"><form class="form" id="tradeForm" method="dialog"></form></dialog>
<dialog id="pbDlg"><form class="form" id="pbForm" method="dialog"></form></dialog>
<dialog id="adDlg"><form class="form" id="adForm" method="dialog"></form></dialog>
<dialog id="lightbox"><img id="lbImg" alt=""></dialog>

<div class="onboard" id="onboard">
  <div class="ob-top"><b id="obLogo"></b><div class="progress"><i id="obBar"></i></div><button class="btn ghost sm" data-act="lang" id="obLang"></button></div>
  <div class="ob-body" id="obBody"></div>
</div>

<datalist id="symbols"></datalist>
<datalist id="pbList"></datalist>

<script>
const KEY = "trading-journal-v1";
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
let trades = [], playbooks = [], days = {}, notes = [], profile = null;
let ads = [], adsHidden = [], feedUrl = "", remoteAds = [], feedStatus = "", customSyms = [];
function read(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
function write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert(L("تعذّر الحفظ: مساحة المتصفح ممتلئة", "Could not save: browser storage is full")); } }

/* ---------- language ---------- */
let lang = read(KEY + "-lang", "ar") === "en" ? "en" : "ar";
const L = (ar, en) => lang === "en" ? en : ar;
const WEEKDAYS = {ar: ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"], en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]};
const WD_SHORT = {ar: WEEKDAYS.ar, en: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const MONTHS = {ar: ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"], en: ["January","February","March","April","May","June","July","August","September","October","November","December"]};
// Mistakes and emotions are stored as keys so saved trades read correctly in either language
const MISTAKES = [["early","دخول مبكر","Early entry"],["late","دخول متأخر","Late entry"],["nosl","بدون وقف خسارة","No stop loss"],["movesl","تحريك الوقف","Moved stop"],
  ["earlyexit","إغلاق مبكر","Early exit"],["oversize","حجم كبير","Oversized"],["revenge","تداول انتقامي","Revenge trade"],["offplan","خارج الخطة","Off plan"],
  ["overtrade","تداول مفرط","Overtrading"],["news","تجاهل الأخبار","Ignored news"]];
const EMOTIONS = [["calm","😌","هادئ","Calm"],["confident","😎","واثق","Confident"],["fear","😰","خائف","Fearful"],["greed","🤑","طمع","Greedy"],
  ["revenge","😤","انتقام","Revenge"],["hesitant","😕","متردد","Hesitant"],["tired","😴","متعب","Tired"]];

/* ---------- helpers ---------- */
const n = v => v === "" || v == null || isNaN(+v) ? null : +v;

// Net P&L after fees; null while the trade is still open
// Trades logged with an outcome store the amount unsigned; the outcome gives the sign
function pnl(t){
  let p = n(t.pnl);
  if(t.outcome){
    if(t.outcome === "open") return null;
    p = t.outcome === "be" ? 0 : Math.abs(p ?? 0) * (t.outcome === "loss" ? -1 : 1);
  } else if(p === null){
    const en = n(t.entry), ex = n(t.exit), sz = n(t.size);
    if(en === null || ex === null || sz === null) return null;
    p = (ex - en) * sz * (n(t.mult) ?? 1) * (t.side === "sell" ? -1 : 1);
  }
  return p - (n(t.fees) ?? 0);
}
function rMultiple(t){
  const en = n(t.entry), ex = n(t.exit), sl = n(t.sl);
  if(en === null || ex === null || sl === null || en === sl) return null;
  return (ex - en) / Math.abs(en - sl) * (t.side === "sell" ? -1 : 1);
}
function result(t){ const p = pnl(t); return p === null ? "open" : p > 0 ? "win" : p < 0 ? "loss" : "be"; }

// Account balance just before each closed trade, so % figures reflect the account at that moment
let BI = null;
function balanceInfo(){
  const start = n(profile?.balance);
  if(!start) return null;
  const before = {}; let b = start;
  trades.filter(t => pnl(t) !== null).sort(byTime).forEach(t => { before[t.id] = b; b += pnl(t); });
  return {start, before, now: b};
}
const tradePct = t => BI && BI.before[t.id] ? pnl(t) / BI.before[t.id] * 100 : null;
const periodPct = closed => BI && closed.length && BI.before[closed[0].id] ? closed.reduce((a, t) => a + pnl(t), 0) / BI.before[closed[0].id] * 100 : null;
const pctS = v => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";

function stats(list){
  const closed = list.filter(t => pnl(t) !== null).sort(byTime);
  const wins = closed.filter(t => pnl(t) > 0), losses = closed.filter(t => pnl(t) < 0);
  const sum = a => a.reduce((s, t) => s + pnl(t), 0);
  const total = sum(closed), gw = sum(wins), gl = Math.abs(sum(losses));
  let eq = 0, peak = 0, dd = 0, cw = 0, cl = 0, mw = 0, ml = 0;
  const equity = [0];
  closed.forEach(t => {
    const p = pnl(t); eq += p; equity.push(eq); peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq);
    if(p > 0){ cw++; cl = 0; } else if(p < 0){ cl++; cw = 0; } else { cw = cl = 0; }
    mw = Math.max(mw, cw); ml = Math.max(ml, cl);
  });
  const byDay = {};
  closed.forEach(t => { const d = byDay[t.date] = byDay[t.date] || {p:0, c:0, w:0}; d.p += pnl(t); d.c++; if(pnl(t) > 0) d.w++; });
  const dayVals = Object.values(byDay);
  const rs = closed.map(rMultiple).filter(v => v !== null);
  const avgW = wins.length ? gw / wins.length : 0, avgL = losses.length ? gl / losses.length : 0;
  return {
    closed, wins, losses, total, gw, gl, equity, maxDD: dd, maxWinStreak: mw, maxLossStreak: ml, byDay,
    open: list.length - closed.length, wr: closed.length ? wins.length / closed.length * 100 : null, pf: gl ? gw / gl : (gw ? Infinity : null),
    avgW, avgL, ratio: avgL ? avgW / avgL : null,
    expectancy: closed.length ? total / closed.length : null,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    best: closed.length ? Math.max(...closed.map(pnl)) : null, worst: closed.length ? Math.min(...closed.map(pnl)) : null,
    fees: closed.reduce((s, t) => s + (n(t.fees) ?? 0), 0),
    dayWr: dayVals.length ? dayVals.filter(d => d.p > 0).length / dayVals.length * 100 : null,
    bestDay: dayVals.length ? Math.max(...dayVals.map(d => d.p)) : null, worstDay: dayVals.length ? Math.min(...dayVals.map(d => d.p)) : null,
    tradingDays: dayVals.length
  };
}

// Six 0-100 sub-scores averaged into one overall performance score
function scoreOf(s){
  if(!s.closed.length) return null;
  const clamp = v => Math.max(0, Math.min(100, v));
  const parts = [
    [L("نسبة النجاح","Win rate"), clamp(s.wr)],
    [L("معامل الربح","Profit factor"), clamp((s.pf === Infinity ? 3 : s.pf || 0) / 3 * 100)],
    [L("متوسط ربح/خسارة","Avg win/loss"), clamp((s.ratio ?? (s.avgW ? 3 : 0)) / 2.5 * 100)],
    [L("التراجع","Drawdown"), clamp(100 * (1 - s.maxDD / (s.gw || 1)))],
    [L("أيام رابحة","Winning days"), clamp(s.dayWr ?? 0)],
    [L("التعافي","Recovery"), clamp((s.maxDD ? s.total / s.maxDD : (s.total > 0 ? 3 : 0)) / 3 * 100)]
  ];
  return {parts, total: parts.reduce((a, p) => a + p[1], 0) / parts.length};
}

function groupBy(list, keyFn){
  const g = {};
  list.filter(t => pnl(t) !== null).forEach(t => {
    [].concat(keyFn(t)).forEach(k => {
      const x = g[k] = g[k] || {k, c:0, w:0, p:0, gw:0, gl:0}; const p = pnl(t);
      x.c++; x.p += p; if(p > 0){ x.w++; x.gw += p; } else x.gl -= p;
    });
  });
  return Object.values(g);
}

/* ---------- charts ---------- */
function setup(c){
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
  ctx.font = "11px IBM Plex Sans Arabic"; ctx.direction = "ltr"; return {ctx, w, h};
}
function emptyChart(ctx, w, h, msg){ ctx.fillStyle = cv("--muted"); ctx.font = "14px IBM Plex Sans Arabic"; ctx.textAlign = "center"; ctx.fillText(msg, w/2, h/2); }
const hexA = (hex, a) => { const m = hex.replace("#", "").match(/../g); return m ? `rgba(${m.map(x => parseInt(x, 16)).join(",")},${a})` : hex; };
const short = v => { const a = Math.abs(v), s = v < 0 ? "-$" : "$"; return a >= 1e6 ? s + (a / 1e6).toFixed(1) + "M" : a >= 1e3 ? s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k" : s + Math.round(a); };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Charts are green while in profit and red while in loss
const pnlColor = v => v < 0 ? cv("--loss") : cv("--win");
// Calls fn(progress) from 0 to 1 with an ease-out curve
function animate(fn, dur = 900){
  if(reduceMotion){ fn(1); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / dur); fn(1 - Math.pow(1 - p, 3)); if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const moneyH = v => v == null ? "—" : ((v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2})).replace(/(\.\d+)$/, '<span class="dec">$1</span>');
const fmtVal = (v, fmt) => fmt === "money" ? moneyH(v) : fmt === "pct" ? v.toFixed(1) + "%" : fmt === "dec" ? v.toFixed(2) : Math.round(v).toLocaleString("en-US");
// Numbers marked data-count roll up from zero
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, fmt = el.dataset.fmt;
    if(!isFinite(to)) return;
    animate(p => { el.innerHTML = fmtVal(to * p, fmt); }, 1100);
  });
}

// Area chart; full-size charts draw in, show a hover tooltip and can pin it to the last point
function lineChart(c, pts, opt = {}){
  if(!c) return;
  if(opt === true) opt = {mini: true};
  const mini = !!opt.mini, Lm = mini ? 2 : 48, R = mini ? 2 : 12;
  const draw = (hover, prog = 1) => {
    const {ctx, w, h} = setup(c);
    if(pts.length < 2){ if(!mini) emptyChart(ctx, w, h, L("أضف صفقات مغلقة لرؤية الرسم", "Add closed trades to see the chart")); return; }
    const ink = opt.color || pnlColor(pts[hover ?? pts.length - 1]), muted = cv("--muted");
    const min = Math.min(0, ...pts), max = Math.max(0, ...pts), padT = mini ? 4 : 34, padB = mini ? 4 : (opt.labels ? 28 : 10);
    const x = i => Lm + (w - Lm - R) * i / (pts.length - 1);
    const y = v => padT + (h - padT - padB) * (1 - (v - min) / ((max - min) || 1));
    if(!mini){
      ctx.font = "11px Inter, IBM Plex Sans Arabic"; ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.strokeStyle = cv("--line"); ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
      for(let k = 0; k <= 4; k++){ const v = min + (max - min) * k / 4; ctx.beginPath(); ctx.moveTo(Lm, y(v)); ctx.lineTo(w - R, y(v)); ctx.stroke(); ctx.fillText(short(v), 0, y(v) + 4); }
      ctx.setLineDash([]);
      if(opt.labels){ ctx.textAlign = "center"; const every = Math.max(1, Math.ceil(pts.length / 6)); opt.labels.forEach((l, i) => { if(i && i % every === 0) ctx.fillText(l, x(i), h - 8); }); }
    }
    const path = () => {
      ctx.beginPath(); ctx.moveTo(x(0), y(pts[0]));
      for(let i = 1; i < pts.length; i++){
        if(opt.jagged) ctx.lineTo(x(i), y(pts[i]));
        else { const xm = (x(i - 1) + x(i)) / 2; ctx.bezierCurveTo(xm, y(pts[i - 1]), xm, y(pts[i]), x(i), y(pts[i])); }
      }
    };
    // Above zero is drawn green and below zero red, each clipped to its side of the zero line
    const zy = y(0), shown = Lm + (w - Lm - R) * prog + 1, alpha = mini ? .16 : opt.glow ? .3 : .2;
    const band = (top, bottom, col, g0, g1) => {
      ctx.save(); ctx.beginPath(); ctx.rect(0, top, shown, bottom - top); ctx.clip();
      path(); ctx.lineTo(x(pts.length - 1), zy); ctx.lineTo(x(0), zy); ctx.closePath();
      const g = ctx.createLinearGradient(0, padT, 0, h - padB); g.addColorStop(0, hexA(col, g0)); g.addColorStop(1, hexA(col, g1));
      ctx.fillStyle = g; ctx.fill();
      path(); ctx.strokeStyle = col; ctx.lineWidth = mini ? 1.6 : 2; ctx.lineJoin = "round";
      if(opt.glow){ ctx.shadowColor = hexA(col, .85); ctx.shadowBlur = 14; }
      ctx.stroke(); ctx.restore();
    };
    if(opt.color) band(0, h, opt.color, alpha, 0);
    else { band(0, zy, cv("--win"), alpha, 0); band(zy, h, cv("--loss"), 0, alpha); }
    if(hover != null){
      const px = x(hover), py = y(pts[hover]);
      ctx.strokeStyle = hexA(muted, .5); ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, h - padB); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.fillStyle = hexA(ink, .22); ctx.fill();

// Tiny area chart without axes, drawn inside cards and asset rows
// With a base value the line is green above it and red below it; without one it uses a single color
function sparkline(c, pts, color, base){
  if(!c || pts.length < 2) return;
  animate(prog => {
    const {ctx, w, h} = setup(c);
    const split = base != null;
    const min = Math.min(...pts, ...(split ? [base] : [])), max = Math.max(...pts, ...(split ? [base] : [])), pad = 3;
    const x = i => w * i / (pts.length - 1), y = v => pad + (h - 2 * pad) * (1 - (v - min) / ((max - min) || 1));
    const path = () => { ctx.beginPath(); ctx.moveTo(x(0), y(pts[0])); for(let i = 1; i < pts.length; i++){ const xm = (x(i - 1) + x(i)) / 2; ctx.bezierCurveTo(xm, y(pts[i - 1]), xm, y(pts[i]), x(i), y(pts[i])); } };
    const zy = split ? y(base) : h;
    const band = (top, bottom, col, g0, g1) => {
      ctx.save(); ctx.beginPath(); ctx.rect(0, top, w * prog + 1, bottom - top); ctx.clip();
      path(); ctx.lineTo(w, zy); ctx.lineTo(0, zy); ctx.closePath();
      const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, hexA(col, g0)); g.addColorStop(1, hexA(col, g1));
      ctx.fillStyle = g; ctx.fill();
      path(); ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.shadowColor = hexA(col, .8); ctx.shadowBlur = 8; ctx.stroke();
      ctx.restore();
    };
    if(split){ band(0, zy, cv("--win"), .38, 0); band(zy, h, cv("--loss"), 0, .38); }
    else band(0, h, color, .38, 0);
  }, 1300);
}
function barChart(c, items, opt = {}){
  if(!c) return;
  const run = prog => {
    const {ctx, w, h} = setup(c);
    const muted = opt.muted || cv("--muted");
    if(!items.length){ emptyChart(ctx, w, h, L("لا توجد بيانات", "No data")); return; }
    const vals = items.map(i => i.value), min = Math.min(0, ...vals), max = Math.max(0, ...vals);
    const Lm = 44, pad = 10, B = 22, plotH = h - pad - B;
    const y = v => pad + plotH * (1 - (v - min) / ((max - min) || 1));
    const slot = (w - Lm - 4) / items.length, bw = Math.max(2, Math.min(22, slot * .62));
    ctx.font = "11px Inter, IBM Plex Sans Arabic"; ctx.strokeStyle = opt.grid || cv("--line"); ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.setLineDash([3, 5]);
    [min, 0, max].forEach(v => { ctx.beginPath(); ctx.moveTo(Lm, y(v)); ctx.lineTo(w, y(v)); ctx.stroke(); ctx.fillText(short(v), 0, y(v) + 4); });
    ctx.setLineDash([]);
    const every = Math.ceil(items.length / 8);
    items.forEach((it, i) => {
      const v = it.value * prog, cx = Lm + slot * i + slot / 2, top = Math.min(y(0), y(v)), bh = Math.max(2, Math.abs(y(v) - y(0)));
      ctx.fillStyle = it.value >= 0 ? (opt.pos || cv("--ink")) : (opt.neg || cv("--loss"));
      ctx.beginPath(); ctx.roundRect(cx - bw/2, top, bw, bh, Math.min(4, bw / 2)); ctx.fill();
      if(i % every === 0){ ctx.fillStyle = muted; ctx.textAlign = "center"; ctx.fillText(it.label, cx, h - 6); }
    });
  };
  animate(run, 900);
}
// Segmented arc gauge (0-100) that fills up on entry
function gauge(c, value, label){
  if(!c) return;
  const run = p => {
    const {ctx, w, h} = setup(c);
    const v = value == null ? null : value * p;
    const cx = w / 2, cy = h * .56, R = Math.min(w / 2 - 8, h * .5), N = 56, a0 = Math.PI * .75, a1 = Math.PI * 2.25;
    const on = value != null && value < 50 ? cv("--loss") : cv("--win"), off = hexA(cv("--muted"), .25);
    ctx.lineCap = "round"; ctx.lineWidth = 3.2;
    for(let i = 0; i < N; i++){
      const a = a0 + (a1 - a0) * i / (N - 1), lit = v != null && i / (N - 1) <= v / 100;
      ctx.strokeStyle = lit ? on : off; ctx.shadowColor = lit ? hexA(on, .8) : "transparent"; ctx.shadowBlur = lit ? 6 : 0; ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (R - (lit ? 26 : 20)), cy + Math.sin(a) * (R - (lit ? 26 : 20))); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.textAlign = "center"; ctx.direction = lang === "en" ? "ltr" : "rtl";
    ctx.fillStyle = cv("--ink"); ctx.font = "500 42px Inter, IBM Plex Sans Arabic"; ctx.fillText(v == null ? "—" : Math.round(v), cx, cy + 10);
    ctx.fillStyle = cv("--muted"); ctx.font = "12px Inter, IBM Plex Sans Arabic"; ctx.fillText(label, cx, cy + 32);
  };
  value == null ? run(1) : animate(run, 1300);
}

function radar(c, parts){
  if(!c) return;
  const {ctx, w, h} = setup(c);
  ctx.direction = lang === "en" ? "ltr" : "rtl";
  const cx = w/2, cy = h/2 + 4, R = Math.min(w, h) / 2 - 42, N = parts.length;
  const pt = (i, r) => [cx + r * Math.sin(2*Math.PI*i/N), cy - r * Math.cos(2*Math.PI*i/N)];
  ctx.strokeStyle = cv("--line");
  [.25,.5,.75,1].forEach(f => { ctx.beginPath(); for(let i = 0; i <= N; i++){ const [x, y] = pt(i % N, R*f); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); });
  ctx.fillStyle = cv("--muted"); ctx.font = "12px IBM Plex Sans Arabic"; ctx.textAlign = "center";
  parts.forEach(([label], i) => { const [x, y] = pt(i, R); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke(); const [lx, ly] = pt(i, R + 22); ctx.fillText(label, lx, ly + 4); });
  ctx.beginPath(); parts.forEach(([, v], i) => { const [x, y] = pt(i, R * v / 100); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
  ctx.globalAlpha = .25; ctx.fillStyle = cv("--accent"); ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = cv("--accent"); ctx.lineWidth = 2; ctx.stroke();
}

      fillTrades();
    }

function fillTrades(){
  const q = tf.q.trim().toLowerCase();
  const list = trades.filter(t =>
    (!q || [t.symbol, t.strategy, t.notes, emotionLabel(t.emotion), ...(t.mistakes || []).map(mistakeLabel)].join(" ").toLowerCase().includes(q)) &&
    (!tf.r || result(t) === tf.r) && (!tf.s || t.side === tf.s) && (!tf.st || t.strategy === tf.st) && (!tf.m || (t.date || "").startsWith(tf.m))
  ).sort(byTime).reverse();
  const s = stats(list);
  const c = (k, v, cl = "") => `<div class="card"><div class="k">${k}</div><div class="v ${cl}"><span class="num">${v}</span></div></div>`;
  $("tStats").innerHTML = c(L("عدد الصفقات", "Trades"), list.length) + c(L("صافي الربح", "Net P&L"), money(s.total), cls(s.total)) + c(L("نسبة النجاح", "Win rate"), pct(s.wr)) + c(L("المتوقع لكل صفقة", "Expectancy"), money(s.expectancy), cls(s.expectancy));
  $("tRows").innerHTML = tradeRows(list);
}

  const q = $("fSymbol").value.trim().toUpperCase();
  const freq = {}; trades.forEach(t => { if(t.symbol) freq[t.symbol] = (freq[t.symbol] || 0) + 1; });
  const recent = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 8);
  const groups = [[L("الأكثر استخداماً", "Most used"), recent], [L("أزواجي المضافة", "My added pairs"), customSyms], ...SYM_GROUPS()];

  hydrate($("shots"));

  });

async function addShot(file, slot){

function updateAmtPct(){
  const el = $("amtPct"); if(!el) return;

  if(!BI){ el.innerHTML = L(`أضف رصيدك من <a href="#settings">الإعدادات</a> لمعرفة النسبة`, `Add your balance in <a href="#settings">Settings</a> to see the %`); return; }

function hydrate(root){ root.querySelectorAll("img[data-img]").forEach(async im => { try{ im.src = await idb.get(im.dataset.img) || ""; }catch(e){} }); }
function compress(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .85));
    };
    img.src = URL.createObjectURL(file);
  });
}
async function addImage(file){
  const id = "img_" + uid();
  await idb.put(id, await compress(file));
  draft.images.push(id); newImgs.push(id); renderImgs();

function download(name, content, type){

function pickFile(accept, cb){
  const i = document.createElement("input"); i.type = "file"; i.accept = accept;
  i.onchange = () => { const f = i.files[0]; if(f) f.text().then(cb); }; i.click();
}
function parseCSV(text){
  const rows = [[]]; let cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"' && text[i + 1] === '"'){ cur += '"'; i++; } else if(c === '"') q = false; else cur += c; }
    else if(c === '"') q = true;
    else if(c === "," || c === ";"){ rows[rows.length - 1].push(cur); cur = ""; }
    else if(c === "\n"){ rows[rows.length - 1].push(cur.replace(/\r$/, "")); rows.push([]); cur = ""; }
    else cur += c;
  }
  rows[rows.length - 1].push(cur); return rows;
}

async function initFirebase(){
  try{
    const [appM, authM, fsM] = await Promise.all(["firebase-app.js", "firebase-auth.js", "firebase-firestore.js"].map(f => import(FB_SDK + f)));
    const app = appM.initializeApp(FB_CONFIG);
    fb = {...authM, ...fsM, auth: authM.getAuth(app), db: fsM.getFirestore(app)};
    fb.onSnapshot(fb.collection(fb.db, "ads"), snap => {
      remoteAds = snap.docs.map(d => cleanAd({...d.data(), id: d.id})).sort((a, b) => b.order - a.order);
      feedStatus = "ok"; renderAds();
      if(/^#(ads|owner)/.test(location.hash)) route();
    }, () => { feedStatus = "error"; });
    fb.onAuthStateChanged(fb.auth, onUser);
  }catch(e){
    fbState = "offline"; route();
  }
}
async function onUser(user){
  unsubMine?.(); unsubAll?.(); unsubMine = unsubAll = null;
  fbUser = user;
  if(!user){
    try{ await fb.signInAnonymously(fb.auth); }catch(e){ fbState = "offline"; route(); }
    return;
  }
  fbState = "ready";
  write(KEY + "-was-owner", isOwner());
  if(isOwner()){
    reqLoaded = false;
    unsubAll = fb.onSnapshot(fb.query(fb.collection(fb.db, "requests"), fb.orderBy("createdAt", "desc")), snap => {
      const known = new Set(allRequests.map(r => r.uid));
      allRequests = snap.docs.map(d => ({uid: d.id, ...d.data()}));
      const fresh = allRequests.filter(r => r.status === "pending" && !known.has(r.uid));
      if(reqLoaded && fresh.length) toast(L(`طلب وصول جديد من ${fresh[0].name}`, `New access request from ${fresh[0].name}`));
      reqLoaded = true;
      renderSideExtras();
      if(/^#(ads|owner)/.test(location.hash)) route();
    });
  }else{
    unsubMine = fb.onSnapshot(fb.doc(fb.db, "requests", user.uid), d => {
      // Offline, a missing cached copy says nothing about the request: keep the last known access
      if(d.metadata.fromCache && !d.exists()) return;
      myRequest = d.exists() ? d.data() : null;
      const ok = myRequest?.status === "approved";

// Announcement images are stored with the announcement, so keep them small
function adImage(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .8));
    };
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- updates ---------- */
// version.json is bumped on every publish; a newer number means the user is running an old copy.
// Reloading only replaces the app itself: trades and settings stay in this browser.
const APP_VERSION = 3;
async function checkVersion(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
    const j = await r.json();
    if(+j.version > APP_VERSION){
      $("updBar").innerHTML = `<span>${ICON.refresh}${L("يتوفر تحديث جديد للتطبيق. بياناتك ستبقى محفوظة.", "A new version of the app is available. Your data stays safe.")}</span>
        <button class="btn sm" data-act="do-update">${L("تحديث الآن", "Update now")}</button>`;
      $("updBar").hidden = false;
    }
  }catch(e){}
}
actions["do-update"] = () => location.reload();
setInterval(checkVersion, 10 * 60000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkVersion(); });

/* ---------- avatars ---------- */
// Square-cropped 256px JPEG, small enough to live in the profile
function squareAvatar(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = 256;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .85));
    };
    img.src = URL.createObjectURL(file);
  });
}
actions["change-avatar"] = () => $("setAvIn").click();
actions["remove-avatar"] = () => { if(profile){ delete profile.avatar; saveAll(); applyLang(); route(); } };
document.addEventListener("change", async e => {
  if(e.target.id !== "setAvIn" || !e.target.files[0]) return;
  profile = {...(profile || {}), avatar: await squareAvatar(e.target.files[0])};
  saveAll(); applyLang(); route();
});

/* ---------- demo data ---------- */
function loadDemo(){
  const pbs = [
    {name: L("كسر الهيكل", "Break of structure"), desc: L("الدخول بعد كسر قمة/قاع مع إعادة اختبار", "Enter after a high/low breaks and is retested"),
      rules: L("الاتجاه واضح على فريم الساعة|كسر بإغلاق شمعة كاملة|انتظار إعادة الاختبار|عائد/مخاطرة 1:2 على الأقل", "Clear trend on H1|Break with a full candle close|Wait for the retest|At least 1:2 reward/risk").split("|")},
    {name: L("ارتداد من الدعم", "Support bounce"), desc: L("شراء من مناطق الطلب القوية", "Buy from strong demand zones"),
      rules: L("منطقة مختبرة مرتين على الأقل|شمعة انعكاسية واضحة|وقف خلف المنطقة", "Zone tested at least twice|Clear reversal candle|Stop behind the zone").split("|")},
    {name: L("افتتاح لندن", "London open"), desc: L("تداول اختراق نطاق آسيا", "Trade the Asian range breakout"),
      rules: L("تحديد نطاق آسيا|الدخول بعد الاختراق فقط|الخروج قبل نيويورك", "Mark the Asian range|Enter only after the breakout|Exit before New York").split("|")}
  ];
  pbs.forEach(p => { if(!playbooks.some(x => x.name === p.name)) playbooks.push({id: uid(), demo: true, ...p}); });
  const assets = [["XAUUSD", 2650, 100, [.1,.5], 2], ["EURUSD", 1.085, 100000, [.2,1], 5], ["NAS100", 20500, 1, [1,3], 1], ["GBPUSD", 1.29, 100000, [.2,.8], 5], ["BTCUSD", 68000, 1, [.05,.3], 0]];
  const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const demoPbs = playbooks.filter(p => p.demo);
  let k = 0;
  for(let back = 70; back >= 1; back--){
    const d = new Date(); d.setDate(d.getDate() - back);
    if(d.getDay() === 0 || d.getDay() === 6 || Math.random() < .25) continue;
    const ds = d.toLocaleDateString("en-CA");
    for(let j = 0, c = 1 + Math.floor(Math.random() * 3); j < c; j++){
      const [sym, base, mult, [s0, s1], dec] = pick(assets), side = Math.random() < .55 ? "buy" : "sell", dir = side === "buy" ? 1 : -1;
      const entry = base * rnd(.97, 1.03), risk = entry * rnd(.002, .004), win = Math.random() < .5;
      const R = win ? rnd(.5, 2.4) : -rnd(.7, 1.15), pb = pick(demoPbs);
      const f = v => +v.toFixed(dec);
      trades.push({id: uid() + k++, demo: true, date: ds, time: `${String(Math.floor(rnd(8, 17))).padStart(2, "0")}:${String(Math.floor(rnd(0, 60))).padStart(2, "0")}`,
        symbol: sym, side, entry: f(entry), exit: f(entry + dir * risk * R), sl: f(entry - dir * risk), tp: f(entry + dir * risk * 2),
        size: +rnd(s0, s1).toFixed(2), mult, pnl: "", fees: (Math.random() * 6).toFixed(2), strategy: pb.name,
        emotion: win ? pick(["calm", "confident"]) : pick(EMOTIONS)[0], rating: win ? Math.ceil(rnd(3, 5)) : Math.ceil(rnd(1, 4)),
        rules: pb.rules.map((_, i) => i).filter(() => Math.random() < (win ? .85 : .5)),
        mistakes: !win && Math.random() < .7 ? [pick(MISTAKES)[0]] : [], notes: "", images: []});
    }
    if(Math.random() < .3) days[ds] = {demo: true, notes: pick(L("التزمت بالخطة اليوم بشكل جيد.|دخلت صفقة بدافع الملل، يجب أن أنتظر الإعداد الكامل.|السوق كان متذبذباً بسبب الأخبار.",
      "Followed my plan well today.|Took a trade out of boredom, need to wait for the full setup.|Choppy market because of the news.").split("|"))};
  }
  if(!notes.length) notes.push({id: uid(), demo: true, title: L("أهدافي هذا الشهر", "My goals this month"),
    body: L("- الالتزام بخطة التداول\n- حد أقصى 3 صفقات يومياً\n- عدم تحريك وقف الخسارة", "- Stick to the trading plan\n- Max 3 trades per day\n- Never move the stop loss"), updated: Date.now()});
  saveAll();
}

    ["swing", "🌊", L("سوينج", "Swing"), L("من أيام إلى أسابيع", "Days to weeks")], ["long", "🏔️", L("طويل المدى", "Long term"), L("أسابيع إلى أشهر", "Weeks to months")]]},
  {key: "account", title: L("أخيراً، معلومات حسابك", "Finally, your account"), sub: L("لحساب الرصيد ونسبة العائد", "Used to calculate your balance and return")}
];
function showOnboarding(){ obStep = 0; obDraft = JSON.parse(JSON.stringify(profile || {})); $("onboard").classList.add("show"); renderOb(); }
function renderOb(){
  const steps = OB_STEPS(), s = steps[obStep];
  $("obBar").style.width = ((obStep + 1) / steps.length * 100) + "%";
  let html = `<h2>${s.title}</h2>${s.sub ? `<p class="sub">${s.sub}</p>` : ""}`;
  if(s.options){
    const sel = obDraft[s.key] || (s.multi ? [] : "");
    html += s.options.map(([v, ic, t, d]) =>
      `<button class="opt ${(s.multi ? sel.includes(v) : sel === v) ? "on" : ""}" data-v="${v}"><span class="ic">${ic}</span><span><b>${t}</b><small>${d}</small></span></button>`).join("");
  } else {
    html += `<div class="avpick"><span class="avbig" id="obAv">${avatarHTML(obDraft)}</span>
        <button type="button" class="btn ghost sm" id="obAvBtn">${L("اختر صورة البروفايل", "Choose a profile picture")}</button>
        <input type="file" id="obAvIn" accept="image/*" hidden></div>
      <label>${L("اسمك", "Your name")}<input id="obName" value="${esc(obDraft.name || "")}" placeholder="${L("مثال: أحمد", "e.g. Alex")}"></label>
      <label>${L("رصيد الحساب الابتدائي ($)", "Starting account balance ($)")}<input id="obBal" type="number" step="any" value="${esc(obDraft.balance || "")}" placeholder="${L("مثال: 1000", "e.g. 1000")}"></label>
      <label>${L("هدف الربح الشهري (%)", "Monthly profit goal (%)")}<input id="obGoal" type="number" step="any" value="${esc(obDraft.goal || "")}" placeholder="${L("مثال: 5", "e.g. 5")}"></label>`;
  }
  html += `<div class="ob-nav">${obStep ? `<button class="btn ghost" id="obBack">${L("رجوع", "Back")}</button>` : ""}
    <button class="btn" id="obNext">${obStep === steps.length - 1 ? L("ابدأ الآن 🚀", "Get started 🚀") : L("متابعة", "Continue")}</button></div>`;
  $("obBody").innerHTML = html;
  if($("obAvBtn")){
    $("obAvBtn").onclick = () => $("obAvIn").click();
    $("obAvIn").onchange = async e => { if(!e.target.files[0]) return; obDraft.avatar = await squareAvatar(e.target.files[0]); $("obAv").innerHTML = avatarHTML(obDraft); };
  }
  $("obNext").disabled = s.options ? !(s.multi ? (obDraft[s.key] || []).length : obDraft[s.key]) : false;
  $("obBody").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(s.multi){ const a = obDraft[s.key] = obDraft[s.key] || []; a.includes(b.dataset.v) ? a.splice(a.indexOf(b.dataset.v), 1) : a.push(b.dataset.v); }
    else obDraft[s.key] = b.dataset.v;
    renderOb();
  });
  if($("obBack")) $("obBack").onclick = () => { obStep--; renderOb(); };
  $("obNext").onclick = () => {
    if(!s.options){
      obDraft.name = $("obName").value.trim(); obDraft.balance = $("obBal").value; obDraft.goal = $("obGoal").value;
      profile = obDraft; saveAll(); $("onboard").classList.remove("show"); applyLang(); route(); showWelcome(); return;
    }
    obStep++; renderOb();
  };
}

// Trade count badge and the monthly-goal arc at the bottom of the sidebar
function renderSideExtras(){
  if($("navCnt")) $("navCnt").textContent = trades.length;
  const pending = allRequests.filter(r => r.status === "pending").length;
  if($("navAdminCnt")){ $("navAdminCnt").textContent = pending; $("navAdminCnt").style.display = pending ? "" : "none"; }
  document.title = (isOwner() && pending ? `(${pending}) ` : "") + APP_NAME;
  const box = $("sideGoal"); if(!box) return;
  const bal = n(profile?.balance), goal = n(profile?.goal);
  if(!bal || !goal){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "";
  const goalAmt = bal * goal / 100, month = today().slice(0, 7);
  const monthP = trades.filter(t => pnl(t) !== null && (t.date || "").startsWith(month)).reduce((a, t) => a + pnl(t), 0);
  box.innerHTML = `<canvas id="cGoal"></canvas><div class="gnum num"><b>${money(monthP)}</b> <span class="muted">/ ${money(goalAmt)}</span></div>
    <small>${monthP >= goalAmt ? L("حققت هدف هذا الشهر", "Monthly goal reached") : L(`متبقي ${money(goalAmt - monthP)} لهدف الشهر`, `${money(goalAmt - monthP)} left to this month's goal`)}</small>`;
  halfGauge($("cGoal"), monthP / goalAmt);
}
